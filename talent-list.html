function talentAgencyRecords(t){try{const v=JSON.parse(localStorage.getItem('xmfx-talent-agencies:'+t.id)||'null');if(Array.isArray(v))return v}catch{}if(t.id==='T0-0')return [{mcn:0,rate:.07},{mcn:1,rate:.09},{mcn:2,rate:null}];if(t.id==='T0-1')return [{mcn:0,rate:.05},{mcn:2,rate:.065}];if(/^T\d+-\d+$/.test(t.id)&&t.currentMcn!=null){const base=t.currentMcn;return [{mcn:base,rate:t.talentRebateRate??.05},{mcn:(base+1)%3,rate:.065+(t.index%3)*.01},...(t.index%2===0?[{mcn:(base+2)%3,rate:null}]:[])]}return t.currentMcn!=null?[{mcn:t.currentMcn,rate:t.talentRebateRate??null}]:[]}
function agencyRate(t,id){const r=talentAgencies(t).find(r=>r.mcn===id);return r?r.rate??annualMCN(id).rate:null}
function agencyName(id){return id==null?'无MCN机构':mcns[id]?.name||'未知机构'}

function talentAgencies(t){return talentAgencyRecords(t).filter(r=>!r.exitedAt)}

function annualMCN(id){
const m=mcns[id];let config={target:2930000*m.scale,baseRate:.04,next:.06,account:30};
try{Object.assign(config,JSON.parse(localStorage.getItem('xmfx-mcn-annual:'+id)||'{}'))}catch{}
const orders=commercialOrders.filter(o=>o.snapshotMcn===id&&o.completedAt?.startsWith('2026')&&o.status==='执行完成'&&o.systemOrderId&&o.attributionConfirmed&&customerData.some(c=>c.id===advertiserData.find(a=>a.id===o.advertiserId)?.customer));
const done=orders.reduce((n,o)=>n+Math.max(0,o.executedAmount-o.refund),0),rate=done>=config.target?config.next:config.baseRate,confirmed=Math.floor(done*rate*.65);
return {...config,media:'MCN统一',share:m.subjects.map(()=>1),done,rate,confirmed,paid:Math.floor(confirmed*.7),mcn:m,current:true};
}
