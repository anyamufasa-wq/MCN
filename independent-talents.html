<main class="shell"><div class="pagebar"><a href="index.html">合作方中心</a><span class="current">野生达人</span><span class="sample">原型 · 示例数据</span></div><section class="sheet list-sheet"><h1 class="list-title">野生达人</h1><form id="wildFilters" class="wild-filters"><label>达人 / 账号<input id="wildQuery" placeholder="搜索名称、昵称或账号ID"></label><label>媒体<select id="wildMedia"><option value="">全部媒体</option><option>抖音-星图</option><option>快手-聚星</option><option>小红书-蒲公英</option><option>b站-花火</option><option>广点通-互选</option><option>微博-微任务</option></select></label><button class="btn primary">搜索</button><button type="button" id="wildReset" class="btn">重置</button></form><div class="list-toolbar"><b id="wildCount"></b></div><div class="table-wrap"><table class="wild-table"><thead><tr><th>达人名称</th><th>行业</th><th>账号数量</th><th>旗下账号 / 媒体 / 账号ID</th><th>签约MCN</th><th>采购负责人</th><th>操作</th></tr></thead><tbody id="wildRows"></tbody></table></div><div class="list-foot"><span id="wildRange"></span><button class="btn" id="wildPrev">上一页</button><span id="wildPage"></span><button class="btn" id="wildNext">下一页</button></div></section></main><dialog id="wildDialog"><div class="wild-dialog-head"><h3 id="wildDialogTitle"></h3><button class="btn" id="wildClose" aria-label="关闭">×</button></div><div id="wildDialogBody"></div></dialog><style>.wild-filters{display:flex;align-items:end;gap:20px;flex-wrap:wrap}.wild-filters label{display:flex;flex-direction:column;gap:8px;color:#738095;font-size:13px}.wild-filters input{width:270px}.wild-table{width:100%;border-collapse:collapse;font-size:13px}.wild-table th{background:#f5f7fb;color:#708097;font-weight:500;text-align:left;padding:16px;white-space:nowrap}.wild-table td{padding:18px 16px;border-bottom:1px solid #e8edf5;vertical-align:middle}.wild-account{padding:8px 0;line-height:1.8}.wild-account small{display:block;color:#8a96a6}.wild-table .link{margin-right:14px;white-space:nowrap}#wildDialog{width:760px;max-width:calc(100vw - 40px);max-height:85vh;border:1px solid #e3e9f2;border-radius:10px;padding:24px;color:#34445d}#wildDialog::backdrop{background:#172b465c}.wild-dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.wild-dialog-head h3{margin:0}.wild-choice{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f5}.wild-choice input{min-height:0}.wild-choice small{color:#8290a3}.wild-error{color:#c33;font-size:13px}</style><script>
const W=id=>document.getElementById(id),escapeW=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wildAccounts=[{id:'WA01',name:'一禾的美好生活',media:'抖音-星图',account:'812006701',owner:'W01'},{id:'WA02',name:'一禾家居手记',media:'小红书-蒲公英',account:'682006702',owner:'W01'},{id:'WA03',name:'一禾的日常',media:'抖音-星图',account:'812006703',owner:'W01'},{id:'WA04',name:'阿川旅行日记',media:'抖音-星图',account:'812009101',owner:'W02'},{id:'WA05',name:'阿川的镜头',media:'b站-花火',account:'392009102',owner:'W02'},{id:'WA06',name:'一禾生活分享',media:'微博-微任务',account:'192006704',owner:null}];
const wildPeople=[{id:'W01',name:'一禾',industry:'家居生活',buyer:'林晓'},{id:'W02',name:'阿川',industry:'旅行户外',buyer:'周宁'}];
let wildPage=1,wildResult=[];function accountsW(t){return wildAccounts.filter(a=>a.owner===t.id)}
try{const saved=JSON.parse(localStorage.getItem('xmfx-wild-accounts')||'null');if(saved)for(const a of wildAccounts)if(Object.hasOwn(saved,a.id))a.owner=saved[a.id]}catch{}
function drawW(){const q=W('wildQuery').value.trim(),media=W('wildMedia').value;wildResult=wildPeople.filter(t=>accountsW(t).length>1&&(!q||(t.name+accountsW(t).map(a=>a.name+a.account).join(' ')).includes(q))&&(!media||accountsW(t).some(a=>a.media===media)));const max=Math.max(1,Math.ceil(wildResult.length/5));wildPage=Math.min(wildPage,max);W('wildCount').textContent='共 '+wildResult.length+' 位野生达人';W('wildRows').innerHTML=wildResult.slice((wildPage-1)*5,wildPage*5).map(t=>`<tr><td><button class="link" data-wild-view="${t.id}">${escapeW(t.name)}</button></td><td>${t.industry}</td><td>${accountsW(t).length}</td><td>${accountsW(t).map(a=>`<div class="wild-account">${escapeW(a.name)}<small>${a.media} · ${a.account}</small></div>`).join('')}</td><td><span class="badge gray">未签约MCN</span></td><td>${t.buyer}</td><td><button class="link" data-wild-view="${t.id}">查看</button><button class="link" data-wild-manage="${t.id}">管理账号</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无符合条件的达人</td></tr>';W('wildRange').textContent='共 '+wildResult.length+' 条';W('wildPage').textContent=wildPage+' / '+max;W('wildPrev').disabled=wildPage===1;W('wildNext').disabled=wildPage===max;document.querySelectorAll('[data-wild-view]').forEach(b=>b.onclick=()=>viewW(b.dataset.wildView));document.querySelectorAll('[data-wild-manage]').forEach(b=>b.onclick=()=>manageW(b.dataset.wildManage))}
function openW(title,html){W('wildDialogTitle').textContent=title;W('wildDialogBody').innerHTML=html;if(!W('wildDialog').open)W('wildDialog').showModal()}
function viewW(id){const t=wildPeople.find(t=>t.id===id);openW(t.name+' · 达人资料',`<p>${t.industry} · 采购负责人 ${t.buyer}</p><table class="wild-table"><thead><tr><th>账号昵称</th><th>媒体</th><th>账号ID</th></tr></thead><tbody>${accountsW(t).map(a=>`<tr><td>${a.name}</td><td>${a.media}</td><td>${a.account}</td></tr>`).join('')}</tbody></table>`)}
function manageW(id){const t=wildPeople.find(t=>t.id===id);openW('管理账号 · '+t.name,`<form id="wildAccountForm">${wildAccounts.filter(a=>!a.owner||a.owner===id).map(a=>`<label class="wild-choice"><input type="checkbox" value="${a.id}" ${a.owner===id?'checked':''}><span>${a.name}<br><small>${a.media} · ${a.account}</small></span></label>`).join('')}<p class="wild-error" id="wildError"></p><div class="dialog-actions"><button type="button" class="btn" id="wildCancel">取消</button><button class="btn primary">保存</button></div></form>`);W('wildCancel').onclick=()=>W('wildDialog').close();W('wildAccountForm').onsubmit=e=>{e.preventDefault();const ids=[...W('wildAccountForm').querySelectorAll('input:checked')].map(i=>i.value);if(ids.length<2){W('wildError').textContent='请至少关联两个账号';return}const next=Object.fromEntries(wildAccounts.map(a=>[a.id,ids.includes(a.id)?id:a.owner===id?null:a.owner]));try{localStorage.setItem('xmfx-wild-accounts',JSON.stringify(next))}catch{W('wildError').textContent='保存失败，请重试';return}wildAccounts.forEach(a=>a.owner=next[a.id]);W('wildDialog').close();drawW()}}
W('wildClose').onclick=()=>W('wildDialog').close();W('wildFilters').onsubmit=e=>{e.preventDefault();wildPage=1;drawW()};W('wildReset').onclick=()=>{W('wildQuery').value=W('wildMedia').value='';wildPage=1;drawW()};W('wildPrev').onclick=()=>{wildPage--;drawW()};W('wildNext').onclick=()=>{wildPage++;drawW()};drawW();
</script></body></html>
