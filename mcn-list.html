<main class="shell"><div class="pagebar"><span>首页</span><span>合作方中心</span><span class="current">MCN管理</span><span class="sample">原型 · 示例数据</span></div><section class="sheet list-sheet"><h1 class="list-title">MCN列表</h1><form id="filters" class="mcn-search"><label>MCN / 主体<input id="query" placeholder="MCN名称 / 主体名称"></label><label>MCN属性<select id="type"></select></label><label>媒体<select id="media"></select></label><label>擅长垂类<select id="vertical"></select></label><label>采购负责人<select id="owner"></select></label><label>年框进度<select id="annual"></select></label><label>返点回款<select id="unpaid"></select></label><div class="search-actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="button" id="reset">重置</button></div></form><div class="list-toolbar"><b id="count"></b><label class="enabled-only"><input type="checkbox" id="enabledOnly">仅展示已启用MCN</label><span class="minor">2026年度 · 数据截至 2026-09-11</span><select id="sort" aria-label="排序"><option value="">默认排序</option><option value="completed">执行完成金额从高到低</option><option value="unpaid">未回款返点从高到低</option></select></div><div class="table-wrap" tabindex="0" aria-label="MCN列表，可横向滚动"><table class="list-table"><thead><tr><th class="pinned">MCN基本信息</th><th>旗下主体</th><th>覆盖媒体</th><th>旗下达人</th><th>合作商单</th><th>执行完成金额</th><th>MCN政策 / 年框进度</th><th>应收返点</th><th>已回款返点</th><th>未回款返点</th><th class="last">操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="list-foot"><span id="range"></span><select id="size" aria-label="每页条数"><option value="5">5条 / 页</option><option value="10">10条 / 页</option><option value="20">20条 / 页</option></select><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div></section><div class="footer-note">新美繁星 · 合作方中心</div></main><script>
function talentAgencyRecords(t){try{const v=JSON.parse(localStorage.getItem('xmfx-talent-agencies:'+t.id)||'null');if(Array.isArray(v))return v}catch{}if(t.id==='T0-0')return [{mcn:0,rate:.07},{mcn:1,rate:.09},{mcn:2,rate:null}];if(t.id==='T0-1')return [{mcn:0,rate:.05},{mcn:2,rate:.065}];return t.currentMcn!=null?[{mcn:t.currentMcn,rate:t.talentRebateRate??null}]:[]}
function agencyRate(t,id){const r=talentAgencies(t).find(r=>r.mcn===id);return r?r.rate??annualMCN(id).rate:null}
function agencyName(id){return id==null?'无MCN机构':mcns[id]?.name||'未知机构'}

function talentAgencies(t){return talentAgencyRecords(t).filter(r=>!r.exitedAt)}

function annualMCN(id){
const m=mcns[id];let config={target:2930000*m.scale,baseRate:.04,next:.06,account:30};
try{Object.assign(config,JSON.parse(localStorage.getItem('xmfx-mcn-annual:'+id)||'{}'))}catch{}
const orders=commercialOrders.filter(o=>o.snapshotMcn===id&&o.completedAt?.startsWith('2026')&&o.status==='执行完成'&&o.systemOrderId&&o.attributionConfirmed&&customerData.some(c=>c.id===advertiserData.find(a=>a.id===o.advertiserId)?.customer));
const done=orders.reduce((n,o)=>n+Math.max(0,o.executedAmount-o.refund),0),rate=done>=config.target?config.next:config.baseRate,confirmed=Math.floor(done*rate*.65);
return {...config,media:'MCN统一',share:m.subjects.map(()=>1),done,rate,confirmed,paid:Math.floor(confirmed*.7),mcn:m,current:true};
}

];
const advertiserData=basePolicies.flatMap((p,i)=>[...customerData.map((c,j)=>({id:`AD${i+1}00${j+1}`,media:p.media,name:c.brand+'官方投放户',customer:c.id})),{id:`AD${i+1}009`,media:p.media,name:'品牌联合推广户',customer:null}]);
const talentData=mcns.flatMap((m,mi)=>[...talentSeed,['知夏的生活志','抖音-星图','家居生活',46.2,42000,35000,0,0,0,'已转出']].map((r,i)=>({id:`T${mi}-${i}`,index:i,originMcn:mi,currentMcn:i===talentSeed.length?null:mi,currentMcnName:i===talentSeed.length?'远川内容':m.name,subject:r[6],name:(mi===0?'':mi===1?'青禾·':'云栖·')+r[0],media:r[1],vertical:r[2],fans:r[3],quote:Math.round(r[4]*m.scale),deal:Math.round(r[5]*m.scale),accountId:String(80000000000+mi*10000+i),platformId:String(7600000000000000000n+BigInt(mi*10000+i)),region:['杭州','上海','成都'][r[6]],cpm:[42.8,65.2,37.1,51.6][i%4],cpe:[3.6,5.2,2.8,4.3][i%4],talentType:i%3===0?'全约经纪':i%3===1?'独家商务':'平台挂靠',subsidy:i%5===0,channel:r[1]==='广点通-互选'?'视频号':''})));
const commercialOrders=talentData.flatMap(t=>Array.from({length:t.currentMcn===null?2:4},(_,j)=>{
 const mi=t.originMcn,mediaIndex=basePolicies.findIndex(p=>p.media===t.media),unknown=j===2&&t.index%3===0,status=j<2?'执行完成':j===2?(t.index%2===0?'执行完成':'执行中'):(t.index%4===0?'已取消':t.index%3===0?'待执行':'执行中');
 const account=advertiserData.find(a=>a.media===t.media&&a.customer===(unknown?null:customerData[(t.index+j)%4].id));
 const customer=customerData.find(c=>c.id===account.customer),base=Math.round(t.deal*(1+j*.06)),completed=status==='执行完成',refund=completed&&j===1&&t.index%4===1?Math.round(base*.08):0;
 const mon=j===0?'03':j===1?'06':j===2?'08':'09',day=String(3+t.index%7).padStart(2,'0');
 return {id:`SD${mi+1}${mediaIndex+1}${String(t.index).padStart(2,'0')}${j+1}`,platformOrderId:`${mediaIndex+1}2026${mi+1}${String(t.index).padStart(3,'0')}${j+1}`,systemOrderId:unknown?null:`CG2026${mi+1}${String(t.index).padStart(3,'0')}${j+1}`,talentId:t.id,media:t.media,advertiserId:account.id,brand:t.index===0&&j===1?'澄露':customer?.brand||'初野',status,orderAmount:base,executedAmount:completed?base:0,settledAmount:completed&&j===0?base-refund:0,serviceFee:Math.round(base*.05),refund,customerIncome:unknown?null:Math.round(base*1.2),createdAt:`2026-${mon}-${day}`,completedAt:completed?`2026-${mon}-${String(+day+3).padStart(2,'0')}`:null,settledAt:completed&&j===0?`2026-${mon}-25`:null,snapshotMcn:mi,snapshotSubject:t.subject,attributionConfirmed:!unknown,source:unknown?'媒体平台':'系统＋媒体平台'};
}));

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'¥ '+Math.round(n).toLocaleString('zh-CN'),wan=n=>(n/10000).toFixed(2)+'万';
const sum=(a,f)=>a.reduce((n,x)=>n+f(x),0),customer=o=>customerData.find(c=>c.id===advertiserData.find(a=>a.id===o.advertiserId)?.customer),linked=o=>o.systemOrderId&&customer(o)&&o.attributionConfirmed,effective=o=>linked(o)&&o.status==='执行完成',net=o=>Math.max(0,o.executedAmount-o.refund);
const entries=mcns.map((m,id)=>{const orders=commercialOrders.filter(o=>o.snapshotMcn===id),talents=talentData.filter(t=>talentAgencies(t).some(r=>r.mcn===id)),policies=basePolicies.map((p,i)=>{const completed=orders.filter(o=>o.media===p.media&&effective(o)),done=sum(completed,net),confirmed=Math.floor(done*p.rate*.65);return {...p,done,target:[1200000,240000,900000,250000,180000,160000][i]*m.scale,confirmed,paid:Math.floor(confirmed*.7)}});return {...m,id,orders,talents,policies,completed:sum(orders.filter(effective),net),confirmed:annualMCN(id).confirmed,paid:annualMCN(id).paid}});
let page=1,result=[];const fields=['query','type','media','vertical','owner','annual','unpaid'];
function options(id,items){$(id).innerHTML='<option value="">全部</option>'+items.map(x=>`<option>${esc(x)}</option>`).join('')}
options('type',['自营','合作']);options('media',basePolicies.map(p=>p.media));options('vertical',[...new Set(mcns.flatMap(m=>m.vertical.split(' · ')))]);options('owner',[...new Set(mcns.map(m=>m.owner))]);options('annual',['未达标','已达标']);options('unpaid',['有未回款','已全部回款']);
function policyScope(m){return [annualMCN(m.id)]}
function href(m,tab='overview'){return 'mcn-detail.html?'+new URLSearchParams({mcn:m.id,tab,listState:location.hash})}
function filter(){const v=Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));result=entries.filter(m=>(!$('enabledOnly').checked||m.usageStatus!=='封停')&&(!v.query||(m.name+m.subjects.join(' ')).includes(v.query))&&(!v.type||m.type===v.type)&&(!v.media||m.policies.some(p=>p.media===v.media))&&(!v.vertical||m.vertical.includes(v.vertical))&&(!v.owner||m.owner===v.owner)&&(!v.annual||policyScope(m).some(p=>v.annual==='已达标'?p.done>=p.target:p.done<p.target))&&(!v.unpaid||(v.unpaid==='有未回款'?m.confirmed>m.paid:m.confirmed===m.paid)));const sort=$('sort').value;if(sort)result.sort((a,b)=>sort==='unpaid'?(b.confirmed-b.paid)-(a.confirmed-a.paid):b.completed-a.completed);history.replaceState(null,'','#'+new URLSearchParams({...v,page,sort,enabledOnly:$('enabledOnly').checked?'1':'0'}).toString());render()}
function render(){const size=+$('size').value,max=Math.max(1,Math.ceil(result.length/size));page=Math.max(1,Math.min(page,max));const visible=result.slice((page-1)*size,page*size);$('count').textContent=`共 ${result.length} 家MCN`;$('range').textContent=`共 ${result.length} 家 · 第 ${page} / ${max} 页`;$('prev').disabled=page===1;$('next').disabled=page===max;
 $('rows').innerHTML=visible.map(m=>`<tr><td class="pinned"><a class="name" href="${href(m)}">${esc(m.name)}</a><div class="minor"><span class="badge green">合作中</span> <span class="badge">${m.type}</span>${m.usageStatus==='封停'?' <span class="badge" style="color:#c13c3c;background:#fff0f0">封停</span>':''}</div><div class="minor">${esc(m.vertical)}</div><div class="minor">采购负责人：${esc(m.owner)}</div></td><td class="subjects">${m.subjects.map(s=>`<div>${esc(s)}</div>`).join('')}<div class="minor">共 ${m.subjects.length} 个主体</div></td><td>${basePolicies.map(p=>`<div class="media-line">${p.media}</div>`).join('')}</td><td class="num"><a href="${href(m,'talents')}">${m.talents.length}</a></td><td class="num"><a href="${href(m,'records')}">${m.orders.filter(linked).length}</a></td><td class="num"><a href="${href(m,'records')}">${money(m.completed)}</a></td><td class="policies">${policyScope(m).map(p=>`<div class="policy-row"><div class="between"><a href="${href(m,'policy')}">MCN统一年框</a><strong>${(p.done/p.target*100).toFixed(1)}%</strong></div><div class="minor">当前返点 ${(p.rate*100).toFixed(1)}% · 距目标 ${wan(Math.max(0,p.target-p.done))}</div></div>`).join('')}</td><td class="num">${money(m.confirmed)}</td><td class="num">${money(m.paid)}</td><td class="num orange">${money(m.confirmed-m.paid)}</td><td class="last"><a href="${href(m)}">查看详情</a></td></tr>`).join('')||'<tr><td colspan="11" class="empty">暂无符合条件的MCN，请调整条件或重置筛选。</td></tr>';
}
$('filters').onsubmit=e=>{e.preventDefault();page=1;filter()};$('enabledOnly').onchange=()=>{page=1;filter()};$('reset').onclick=()=>{$('enabledOnly').checked=false;fields.forEach(k=>$(k).value='');$('sort').value='';page=1;filter()};$('sort').onchange=()=>{page=1;filter()};$('size').onchange=()=>{page=1;filter()};$('prev').onclick=()=>{page--;filter()};$('next').onclick=()=>{page++;filter()};
const saved=new URLSearchParams(location.hash.slice(1));fields.forEach(k=>{if(saved.has(k))$(k).value=saved.get(k)});$('sort').value=saved.get('sort')||'';page=+saved.get('page')||1;$('enabledOnly').checked=saved.get('enabledOnly')==='1';filter();
