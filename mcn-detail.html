function annualMCN(id){
const m=mcns[id];let config={target:2930000*m.scale,baseRate:.04,next:.06,account:30};
try{Object.assign(config,JSON.parse(localStorage.getItem('xmfx-mcn-annual:'+id)||'{}'))}catch{}
const orders=commercialOrders.filter(o=>o.snapshotMcn===id&&o.completedAt?.startsWith('2026')&&o.status==='执行完成'&&o.systemOrderId&&o.attributionConfirmed&&customerData.some(c=>c.id===advertiserData.find(a=>a.id===o.advertiserId)?.customer));
const done=orders.reduce((n,o)=>n+Math.max(0,o.executedAmount-o.refund),0),rate=done>=config.target?config.next:config.baseRate,confirmed=Math.floor(done*rate*.65);
return {...config,media:'MCN统一',share:m.subjects.map(()=>1),done,rate,confirmed,paid:Math.floor(confirmed*.7),mcn:m,current:true};
}

function calculator(index,order=null){
 let t=getTalent(index),p=annualMCN(state.mcn),ts=talentStats(t),income=order?.customerIncome??'',cost=order?.orderAmount??ts.deal??t.quote,fee=order?.serviceFee??0;
 showModal('合作收益测算',`<div class="policy-strip"><div><b>${esc(t.name)}</b><span class="hint">${t.media} · ${esc(M().name)}${order?' · 商单 '+order.platformOrderId:''}</span></div></div><div class="form-grid"><label class="field">客户报价 / 收入（元）<input type="number" id="income" value="${income}" placeholder="填写客户报价" min="0" step="100"></label><label class="field">${order?'商单下单金额':'预计采购成本'}（元）<input type="number" id="cost" value="${cost}" min="0" step="100"></label><label class="field">平台服务费及其他成本（元）<input type="number" id="otherCost" value="${fee}" min="0" step="1"></label><label class="field">退款金额（元）<input type="number" id="calcRefund" value="${order?.refund??0}" min="0"></label></div><div class="hint" style="margin-top:12px">当前返点 ${pct(p.rate)} · ${order?'金额来自关联商单及系统合作单':'采购成本参考最近成交价；客户收入由采购填写'}</div><div id="calcResult" class="calc-result"></div><div class="notice">按同一含税口径试算，平台服务费单独列示。${order?'已计入年框的商单不重复增加贡献。':'本次执行完成后预计计入年框。'}年度追溯补差单独展示，待核对后确认。</div>`);
 const calculate=()=>{let revenue=$('income').value===''?null:+$('income').value,cost=+$('cost').value,other=+$('otherCost').value,refund=+$('calcRefund').value;if([cost,other,refund].some(x=>!Number.isFinite(x)||x<0)||refund>cost||revenue!==null&&(!Number.isFinite(revenue)||revenue<0)){$('calcResult').textContent='请输入有效金额，退款不能超过采购金额';return}let effectiveCost=Math.max(0,cost-refund),cancelled=order?.status==='已取消',linked=order?isLinked(order):true,contribution=cancelled||!linked?0:effectiveCost,already=order&&isEffective(order)?netAmount(order):0,after=p.done-already+contribution,rebate=contribution*p.rate,gross=revenue===null?null:revenue-effectiveCost-other+rebate,extra=after>=p.target&&p.done<p.target?after*(p.next-p.rate):0;
 $('calcResult').innerHTML=`<div class="between"><div><span class="label">本次预计毛利</span><div class="number">${gross===null?'待填写客户报价':money(gross)}</div></div><div><span class="label">预计毛利率</span><div class="number">${revenue>0?pct(gross/revenue):'—'}</div></div></div><hr class="divider"><div class="between"><span>本次预估基础返点</span><b>${money(rebate)}</b></div><div class="between" style="margin-top:10px"><span>${already?'已计入年框金额':'本次预计年框贡献'}</span><b>${money(already||contribution)}</b></div><div class="between" style="margin-top:10px"><span>按本次条件计算后距下一档</span><b>${money(Math.max(0,p.target-after))}</b></div><div class="hint" style="margin-top:12px">${cancelled?'已取消商单不计入年框与返点。':!linked?'该商单待关联，尚不计入本MCN年框及返点。':already?'本商单已在年度执行金额内，试算仅替换本笔金额，不重复累计。':extra?'预计触发年度追溯补差 '+money(extra)+'，单独核对确认。':'未触发新的年度返点档位。'}</div>`};
 ['income','cost','otherCost','calcRefund'].forEach(id=>$(id).oninput=calculate);calculate();
}

 if(['year','q3'].includes(requested.period))state.period=requested.period;
 for(const [key,allowed] of Object.entries({sub:['current','changes'],vertical:['all','美妆个护','时尚穿搭','家居生活'],budget:['all','low','high'],status:['all','合作中','已合作','未合作'],orderStatus:['all','待执行','执行中','执行完成','已取消'],orderLink:['all','linked','pending'],orderDateField:['createdAt','completedAt'],talentRange:['current','past'],amountView:['business','amount']})){if(allowed.includes(requested[key]))state[key]=requested[key]}
 for(const key of ['orderCustomer','talentCustomer'])if(['all','unmatched',...customerData.map(c=>c.id)].includes(requested[key]))state[key]=requested[key];
 for(const key of ['query','orderQuery','orderBrand','talentBrand'])if(typeof requested[key]==='string')state[key]=requested[key].slice(0,200);
 if(talentData.some(t=>t.id===requested.orderTalent&&t.originMcn===state.mcn))state.orderTalent=requested.orderTalent;
 restoreScroll=Number.isFinite(requested._scrollY)?Math.max(0,requested._scrollY):0;
}catch{}
header();$('mediaFilter').value=state.media;$('periodFilter').value=state.period;render();
requestAnimationFrame(()=>{if(routeParams.has('restore'))window.scrollTo(0,restoreScroll);else if(state.tab!=='overview')$('section-'+state.tab)?.scrollIntoView({block:'start'})});

const quickButtons=[...document.querySelectorAll('[data-anchor]')];
function markQuickAnchor(){let active='overview';const offset=document.querySelector('.mcn-quick-nav').offsetHeight+$('filters').offsetHeight+30;for(const b of quickButtons){const target=$('section-'+b.dataset.anchor);if(target&&target.getBoundingClientRect().top<=offset)active=b.dataset.anchor}quickButtons.forEach(b=>{b.classList.toggle('active',b.dataset.anchor===active);if(b.dataset.anchor===active)b.setAttribute('aria-current','location');else b.removeAttribute('aria-current')})}
quickButtons.forEach(b=>b.onclick=()=>{const target=$('section-'+b.dataset.anchor);if(target){const top=target.getBoundingClientRect().top+scrollY-document.querySelector('.mcn-quick-nav').offsetHeight-$('filters').offsetHeight-16;window.scrollTo({top,behavior:'smooth'})}});
window.addEventListener('scroll',markQuickAnchor,{passive:true});window.addEventListener('resize',markQuickAnchor);markQuickAnchor();
</script></body></html>
