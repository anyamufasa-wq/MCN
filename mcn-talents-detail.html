function talentAgencyRecords(t){try{const v=JSON.parse(localStorage.getItem('xmfx-talent-agencies:'+t.id)||'null');if(Array.isArray(v))return v}catch{}if(t.id==='T0-0')return [{mcn:0,rate:.07},{mcn:1,rate:.09},{mcn:2,rate:null}];if(t.id==='T0-1')return [{mcn:0,rate:.05},{mcn:2,rate:.065}];if(/^T\d+-\d+$/.test(t.id)&&t.currentMcn!=null){const base=t.currentMcn;return [{mcn:base,rate:t.talentRebateRate??.05},{mcn:(base+1)%3,rate:.065+(t.index%3)*.01},...(t.index%2===0?[{mcn:(base+2)%3,rate:null}]:[])]}return t.currentMcn!=null?[{mcn:t.currentMcn,rate:t.talentRebateRate??null}]:[]}
function agencyRate(t,id){const r=talentAgencies(t).find(r=>r.mcn===id);return r?r.rate??annualMCN(id).rate:null}
function agencyName(id){return id==null?'无MCN机构':mcns[id]?.name||'未知机构'}

function talentAgencies(t){return talentAgencyRecords(t).filter(r=>!r.exitedAt)}

function subjectRates(supplierId,name,media,index=-1){
 const record=SupplierCooperation.subjectsFor(supplierId).findLast(subject=>subject.name===name);
 if(record)return record.media.map(key=>({media:SupplierCooperation.mediaLabels[key]||key,label:key,rate:record.profiles?.[key]?.rate==null||record.profiles[key].rate===''?null:Number(record.profiles[key].rate)/100}));
 return media.map(key=>({media:key,label:key,rate:index<0?null:Math.round(((basePolicies.find(p=>p.media===key)?.rate??.04)+index*.005)*10000)/10000}));
}
function subjectRateCells(subject){
 const rates=subject.rates?.length?subject.rates:subject.media.map(label=>({label,media:label,rate:null}));
 const lines=format=>rates.map(item=>`<div style="line-height:1.65;white-space:nowrap">${format(item)}</div>`).join('')||'—';
 const accountCount=item=>subject.accounts.filter(account=>{
  if(account.media!==item.media)return false;
  if(item.media!=='广点通-互选'||item.label===item.media)return true;
  return item.label===TalentPRD.mediaName(account)+'互选';
 }).length;
 return `<td style="vertical-align:top">${lines(item=>esc(item.label))}</td><td style="vertical-align:top;font-variant-numeric:tabular-nums">${lines(item=>item.rate===null?'待设置':(item.rate*100).toLocaleString('zh-CN',{maximumFractionDigits:2})+'%')}</td><td style="vertical-align:top;font-variant-numeric:tabular-nums">${lines(accountCount)}</td>`;
}
function orderRate(o){
 const supplierId='mcn:'+o.snapshotMcn,name=mcns[o.snapshotMcn].subjects[o.snapshotSubject];
 const channel=o.media==='广点通-互选'?talentOf(o)?.channel:null;
 return subjectRates(supplierId,name,[o.media],o.snapshotSubject)
  .find(item=>item.media===o.media&&(!channel||item.label===o.media||item.label===channel+'互选'))?.rate??0;
}
const orderRebate=o=>netAmount(o)*orderRate(o);
function annualMCN(id){
 const m=mcns[id],account=SupplierCooperation.accountDays('mcn:'+id);
 const orders=commercialOrders.filter(o=>o.snapshotMcn===id&&o.completedAt?.startsWith(String(new Date().getFullYear()))&&o.status==='执行完成'&&o.systemOrderId&&o.attributionConfirmed&&customerData.some(c=>c.id===advertiserData.find(a=>a.id===o.advertiserId)?.customer)),done=orders.reduce((n,o)=>n+netAmount(o),0),estimate=orders.reduce((n,o)=>n+orderRebate(o),0),confirmed=Math.floor(estimate*.65);
 const paid=Math.floor(confirmed*.7),today=new Date();today.setHours(0,0,0,0);
 const overdueBase=orders.filter(o=>{const [y,m,d]=o.completedAt.split('-').map(Number),due=new Date(y,m-1,d);due.setDate(due.getDate()+account);return due<today;}).reduce((n,o)=>n+orderRebate(o),0);
 const overdue=Math.max(0,Math.floor(overdueBase*.65)-paid);
 return {account,estimate,rate:done?estimate/done:0,media:'全部媒体',done,confirmed,paid,overdue,mcn:m,current:true};
}
