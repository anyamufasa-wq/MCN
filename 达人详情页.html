<script>
function annualMCN(id){
const m=mcns[id];let config={target:2930000*m.scale,baseRate:.04,next:.06,account:30};
try{Object.assign(config,JSON.parse(localStorage.getItem('xmfx-mcn-annual:'+id)||'{}'))}catch{}
const orders=commercialOrders.filter(o=>o.snapshotMcn===id&&o.completedAt?.startsWith('2026')&&o.status==='执行完成'&&o.systemOrderId&&o.attributionConfirmed&&customerData.some(c=>c.id===advertiserData.find(a=>a.id===o.advertiserId)?.customer));
const done=orders.reduce((n,o)=>n+Math.max(0,o.executedAmount-o.refund),0),rate=done>=config.target?config.next:config.baseRate,confirmed=Math.floor(done*rate*.65);

function part(id,name,body,action=''){return `<section class="stack-section" id="section-${id}"><div class="stack-title"><h2>${name}</h2>${action}</div>${body}</section>`}
function infoRow(label,value){return `<div class="info-pair"><span>${label}</span><div>${value}</div></div>`}
function asideProfile(){return `<aside class="talent-profile"><div class="profile-initial">${esc(localProfile.name[0])}</div><h2>${esc(localProfile.name)}</h2><div class="chips"><span class="badge">${talent.vertical}</span>${talent.channel?`<span class="badge gray">${talent.channel}</span>`:''}</div><dl class="aside-facts">${accountIdFields()}<dt>粉丝数量</dt><dd>${display(talent.fans,'万')}</dd><dt>地域</dt><dd>${esc(localProfile.region||'未获取')}</dd><dt>CPM</dt><dd>${display(talent.cpm)}</dd><dt>CPE</dt><dd>${display(talent.cpe)}</dd><dt>MCN</dt><dd>${mcnState()==='partnered'?`<a href="${mcnHref()}">${mcnDisplay()}</a>`:mcnDisplay()}</dd><dt>主页</dt><dd class="muted">未维护</dd></dl>${relatedAccountsPanel()}</aside>`}
function quoteSection(){const groups=quoteGroups[quoteKey(talent)];return `<div class="table-wrap"><table class="quote-table"><thead><tr><th>报价类型</th>${groups.map(g=>`<th>${g.name}</th>`).join('')}</tr></thead><tbody><tr><td>线上报价</td>${groups.map((g,gi)=>`<td style="white-space:nowrap;line-height:1.9">${quoteCell(talent,g,gi)}</td>`).join('')}</tr></tbody></table></div><div class="section-note">${Object.values(talent.quoteValues).every(n=>n==null)?'报价尚未获取，等待平台同步。':'按内容形式展示平台报价，实际成交以商单为准。'}</div>`}
function institutionSection(){const kind=mcnState(),p=policy();if(kind==='unpartnered')return `<div class="info-grid">${infoRow('当前MCN',mcnDisplay())}${infoRow('MCN合作状态','<span class="badge gray">未与我司合作</span>')}</div>`;let html=`<div class="info-grid">${infoRow('当前MCN',kind==='partnered'?`<a href="${mcnHref()}">${mcnDisplay()}</a>`:mcnDisplay())}${infoRow('MCN合作状态',kind==='partnered'?'<span class="badge green">与我司合作中</span>':kind==='unpartnered'?'<span class="badge gray">未与我司合作</span>':kind==='none'?'不适用':'待确认')}${infoRow('媒体归属主体',kind==='partnered'?esc(mcns[talent.currentMcn].subjects[talent.subject]):kind==='none'?'不适用':'待补充')}${infoRow('业务归属机构','新美繁星（北京）传媒科技有限公司')}</div>`;if(p){html+=`<div class="compact-policy"><div class="policy-topline"><strong>MCN统一合作政策</strong><a href="${mcnHref('policy')}">查看MCN政策</a></div><div class="policy-values"><div><span>当前返点</span><b>${pct(p.rate)}</b></div><div><span>达标返点</span><b>${pct(p.next)}</b></div><div><span>账期</span><b>${p.account}天</b></div><div><span>年框目标</span><b>${wan(p.target)}万元</b></div></div><div class="between"><span class="quiet">2026年度执行完成 ${wan(p.done)} / ${wan(p.target)} 万元</span><span class="blue">${pct(p.done/p.target)}</span></div><div class="progress"><i style="width:${Math.min(100,p.done/p.target*100)}%"></i></div><div class="quiet">全部媒体、全部主体累计 · 距下一档 ${wan(Math.max(0,p.target-p.done))} 万元</div></div>`}else html+=`<div class="inline-empty">${kind==='none'?'该达人暂无MCN机构，机构政策与年框不适用。':kind==='unpartnered'?'该MCN尚未与我司建立合作，暂无已确认的机构政策和年框。':'MCN归属信息待补充，机构政策与年框暂无法确认。'}</div>`;return html;}
function brandsSection(){const groups=brandGroups();if(!groups.length)return '<div class="inline-empty"><strong>暂无合作品牌记录</strong><p>当前未获取到该达人的历史品牌合作信息。</p></div>';return `<div class="table-wrap"><table class="brand-customers"><thead><tr><th>合作品牌</th><th>关联客户</th><th>平台商单</th><th>我司关联商单</th><th>总金额</th><th>操作</th></tr></thead><tbody>${groups.map(x=>`<tr><td><strong>${esc(x.brand)}</strong></td><td><div class="brand-client-list">${x.customers.map(c=>c.c?`<button class="link" data-customer="${c.c.id}">${esc(c.c.name)}</button>`:'<span class="missing">待关联客户</span>').join('<span class="client-separator">、</span>')}</div></td><td>${x.rows.length}</td><td>${x.s.linked}</td><td>${money(x.s.done)}</td><td><button class="link" data-brand-orders="${esc(x.brand)}">查看商单</button></td></tr>`).join('')}</tbody></table></div>`}
function commerceSection(){if(!allOrders().length)return '<div class="inline-empty spacious"><strong>尚未与我司合作</strong><p>暂无合作商单和历史成交记录。</p></div>';return orders();}
function reviewSection(){if(!reviews.length)return `<div class="inline-empty">${allOrders().some(effective)?'暂未评价，可结合已完成合作记录评价。':'暂无合作评价，完成合作后可记录评价。'}</div>`;
const max=Math.ceil(reviews.length/5);reviewPage=Math.max(1,Math.min(reviewPage,max));
return reviews.slice((reviewPage-1)*5,reviewPage*5).map(r=>`<article class="talent-review" style="padding:16px 0;border-bottom:1px solid #e8edf5"><div class="record-head"><span class="record-title">${esc(r.project)}</span><span class="badge green">${r.score} / 5分</span></div><p class="record-note" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.note)}</p><div class="quiet">${esc(r.author)} · ${esc(r.createdAt)}</div></article>`).join('')+(reviews.length>5?`<div class="review-pagination" style="display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:16px"><span class="quiet">共 ${reviews.length} 条</span><button class="btn" id="reviewPrev" ${reviewPage===1?'disabled':''}>上一页</button><span>${reviewPage} / ${max}</span><button class="btn" id="reviewNext" ${reviewPage===max?'disabled':''}>下一页</button></div>`:'')}
function render(){const s=stats(),p=policy();$('content').innerHTML=`<div class="stack-layout">${asideProfile()}<div class="stack-main">${part('information','达人信息',`<div class="info-grid">${infoRow('媒体平台',talent.media)}${infoRow('达人类型',esc(localProfile.type||'待补充'))}${infoRow('达人对公主体',esc(localProfile.publicSubject||'未维护'))}${infoRow('达人对私主体',esc(localProfile.privateSubject||'未维护'))}${infoRow('达人评分',evaluation?evaluation.score+' / 5分':'待评价')}</div>`, '<button class="link" data-edit>编辑</button>')}${part('pricing','报价',quoteSection(),'<span class="quiet">平台自动同步</span>')}${mcnState()==='none'?'':part('organization','机构与政策',institutionSection(),mcnState()==='unpartnered'?'':'<button class="link" id="ownershipHistory">归属记录</button>')}${part('contact','补贴与联系方式',`<div class="info-grid">${infoRow('是否有补贴',talent.subsidy===null?'待确认':talent.subsidy?'有补贴 · 金额待确认':'无补贴')}${infoRow('达人返点',talent.talentRebateRate==null?'未维护':pct(talent.talentRebateRate))}${infoRow('联系人',esc(localProfile.contact))}${infoRow('联系电话',esc(localProfile.phone))}${infoRow('微信号',esc(localProfile.wechat))}${infoRow('邮箱',esc(localProfile.email))}</div>`, '<button class="link" data-edit>编辑</button>')}${part('brands','合作品牌与客户',brandsSection())}${part('orders','合作商单',commerceSection())}${part('review','达人评价',reviewSection(),allOrders().some(effective)?'<button class="link" id="writeReview">记录评价</button>':'')}<div class="quiet">最近更新 2026-09-11 10:30 · ${esc(localProfile.remark)||'暂无维护备注'}</div></div></div>`;if($('orderRows')){renderOrders();for(const [id,key]of [['orderSearch','query'],['brandFilter','brand'],['customerFilter','customer'],['statusFilter','status']])$(id)[id==='orderSearch'?'oninput':'onchange']=e=>{ui[key]=e.target.value;renderOrders()};bindCompletionRange();$('orderReset').onclick=()=>{Object.assign(ui,{query:'',brand:'all',customer:'all',status:'all',link:'all',completedFrom:'',completedTo:''});render();scrollSection('orders')}}if($('writeReview'))$('writeReview').onclick=writeReview;if($('reviewPrev'))$('reviewPrev').onclick=()=>{reviewPage--;render();scrollSection('review')};if($('reviewNext'))$('reviewNext').onclick=()=>{reviewPage++;render();scrollSection('review')};bind();}
function scrollSection(name){const section=$('section-'+name);section?.scrollIntoView({behavior:'auto',block:'start'});}
function setTab(name){const targets={overview:'information',pricing:'pricing',orders:'orders',organization:'organization',profile:'information'};scrollSection(targets[name]||name)}
function openOrders(filter={}){Object.assign(ui,{query:'',brand:'all',customer:'all',status:'all',link:'all',completedFrom:'',completedTo:''},filter);if($('modal').open)$('modal').close();render();scrollSection('orders')}
function editQuote(){const fields=quoteFields(quoteKey(talent));showModal('维护线上报价',`<form id="quoteForm"><div class="form-grid">${fields.map((f,i)=>`<label class="field">${f.label}（元）<input type="number" data-quote-field="${f.id}" data-quote-index="${i}" value="${talent.quoteValues[f.id]??''}" min="0" step="0.01" placeholder="未获取"></label>`).join('')}</div><div class="dialog-actions"><button class="btn primary" type="submit">保存报价</button></div></form>`);$('quoteForm').onsubmit=e=>{e.preventDefault();document.querySelectorAll('[data-quote-field]').forEach(i=>talent.quoteValues[i.dataset.quoteField]=i.value===''?null:+i.value);quotes=fields.map(f=>talent.quoteValues[f.id]);$('modal').close();render();scrollSection('pricing');toast('报价已保存')}}
function calculator(o=null){const p=policy(),s=stats(),historical=Boolean(o),known=historical?linked(o):Boolean(p),basePolicy=historical?basePolicies.find(x=>x.media===o.media):p,rate=known?basePolicy.rate:null,origin=o?.snapshotMcn??talent.currentMcn;let target=known?[1200000,240000,900000,250000,180000,160000][basePolicies.findIndex(x=>x.media===talent.media)]*mcns[origin].scale:null;const baseline=known?sum(commercialOrders.filter(x=>x.snapshotMcn===origin&&x.media===talent.media&&effective(x)),net):null;showModal('合作收益测算',`<div class="policy-strip"><div><b>${esc(localProfile.name)}</b><span class="hint">${talent.media}</span></div></div><div class="form-grid"><label class="field">客户报价 / 收入（元）<input id="income" type="number" min="0" value="${o?.customerIncome??''}" placeholder="填写客户报价"></label><label class="field">采购成本（元）<input id="cost" type="number" min="0" value="${o?.orderAmount??s.latest?.orderAmount??quotes[1]??''}" placeholder="报价未获取，请填写"></label><label class="field">平台服务费及其他成本（元）<input id="otherCost" type="number" min="0" value="${o?.serviceFee??0}"></label><label class="field">退款金额（元）<input id="refund" type="number" min="0" value="${o?.refund??0}"></label></div><div class="hint" style="margin-top:12px">机构返点：${rate===null?'暂无已确认政策':pct(rate)}${historical?' · 按商单发生时机构核算':''}</div><div class="calc-result" id="calcResult"></div>`);const calculate=()=>{const revenue=$('income').value===''?null:+$('income').value,cost=$('cost').value===''?null:+$('cost').value,fee=+$('otherCost').value,refund=+$('refund').value;if([revenue,cost,fee,refund].some(n=>n!==null&&(!Number.isFinite(n)||n<0))||cost!==null&&refund>cost){$('calcResult').textContent='请输入有效金额，退款不能超过采购成本。';return}const enough=revenue!==null&&cost!==null,base=enough?revenue-cost+refund-fee:null,cancelled=o?.status==='已取消',rebate=rate!==null&&cost!==null?(cancelled?0:(cost-refund)*rate):null,gross=base!==null&&rebate!==null?base+rebate:null,already=o&&effective(o)?net(o):0,after=baseline===null||cost===null?null:baseline-already+(cancelled?0:cost-refund);$('calcResult').innerHTML=`<div class="calc-grid"><div><span class="label">基础毛利（不含返点）</span><div class="number">${base===null?'待补充金额':money(base)}</div></div><div><span class="label">含返点预计毛利</span><div class="number">${gross===null?'待确认':money(gross)}</div></div></div><hr class="divider"><div class="between"><span>本次预估返点</span><b>${rebate===null?'待确认':money(rebate)}</b></div>${target!==null?`<div class="between" style="margin-top:10px"><span>距年框下一档</span><b>${after===null?'待补充金额':money(Math.max(0,target-after))}</b></div>`:''}<div class="hint" style="margin-top:12px">${rate===null?'机构政策尚未确认，当前可参考基础毛利。':already?'本商单已计入年框，测算不重复累计。':cancelled?'已取消商单不计入年框或返点。':'按本次执行完成后的预计金额测算。'}</div>`};['income','cost','otherCost','refund'].forEach(id=>$(id).oninput=calculate);calculate()}

header();render();
$('scenarioSelect').value=scenario;$('scenarioSelect').onchange=e=>{const next=new URL(location.href);next.searchParams.set('case',e.target.value);location.href=next.href;};



if(params.get('action')==='edit')editTalent();

function bindCompletionRange(){const update=()=>{const from=$('completedFrom').value,to=$('completedTo').value;if(from&&to&&from>to){$('completionError').textContent='开始日期不能晚于结束日期';return}$('completionError').textContent='';ui.completedFrom=from;ui.completedTo=to;renderOrders()};$('completedFrom').onchange=update;$('completedTo').onchange=update}

function accountIdFields(){const names={'抖音-星图':['抖音ID','星图ID'],'快手-聚星':['快手ID','聚星ID'],'小红书-蒲公英':['小红书ID','蒲公英ID'],'b站-花火':['B站UID','花火ID'],'广点通-互选':[talent.channel==='公众号'?'公众号ID':'视频号ID','互选ID'],'微博-微任务':['微博UID','微任务ID']}[talent.media]||['账号ID','平台ID'];return `<dt>${names[0]}：</dt><dd class="account-id-value">${esc(talent.accountId||'未获取')}</dd><dt>${names[1]}：</dt><dd class="account-id-value">${esc(talent.platformId||'未获取')}</dd>`}

function accountGroups(){try{return JSON.parse(localStorage.getItem('xmfx-talent-account-groups')||'[]')}catch{return []}}
function relatedAccountIds(){return accountGroups().find(g=>g.includes(talent.id))||[talent.id]}
function relatedAccountHref(t){const c=t.scenario||(t.id==='T0-7'?'no-mcn':t.id==='T1-4'?'never':t.id==='T2-7'?'incomplete':t.currentMcn===null?'unpartnered':'normal');return '达人详情页.html?'+new URLSearchParams({talent:t.id,case:c,channel:t.channel||'',from:'list'})}
function relatedAccountsPanel(){const linked=relatedAccountIds().filter(id=>id!==talent.id).map(id=>talentData.find(t=>t.id===id)).filter(Boolean);return `<section class="related-accounts" aria-labelledby="relatedTitle"><div class="related-heading"><h3 id="relatedTitle">关联账号 <span>${linked.length}</span></h3></div>${linked.map(t=>`<a class="related-account" href="${relatedAccountHref(t)}"><strong>${esc(t.name)}</strong><span>${esc(t.media)}${t.channel?' · '+esc(t.channel):''}</span><small>ID：${esc(t.accountId)}</small></a>`).join('')||'<div class="related-empty">暂无关联账号</div>'}<button class="btn related-add" id="addRelatedAccount">管理关联账号</button></section>`}
function manageRelatedAccounts(){const chosen=new Set(relatedAccountIds().filter(id=>id!==talent.id));showModal('管理关联账号',`<div class="scope-note">关联同一达人的其他账号，可选择相同媒体或不同媒体的账号。</div><div class="toolbar"><input id="relatedSearch" placeholder="搜索达人昵称 / 账号ID" aria-label="搜索关联账号"><select id="relatedMedia" aria-label="账号媒体"><option value="">全部媒体</option>${basePolicies.map(p=>`<option>${esc(p.media)}</option>`).join('')}</select></div><div id="relatedSelection" class="related-selection"></div><div class="related-candidates" id="relatedCandidates"></div><div class="dialog-actions"><button class="btn" id="cancelRelated">取消</button><button class="btn primary" id="saveRelated">保存关联</button></div>`);
 const paint=()=>{const q=$('relatedSearch').value.trim().toLowerCase(),m=$('relatedMedia').value,groups=accountGroups(),currentGroup=groups.find(g=>g.includes(talent.id))||[];const candidates=talentData.filter(t=>t.id!==talent.id&&(!m||t.media===m)&&(!q||(t.name+' '+t.accountId+' '+t.platformId).toLowerCase().includes(q)));
 $('relatedSelection').innerHTML=`<span>已选择 ${chosen.size} 个账号</span>`+[...chosen].map(id=>{const t=talentData.find(x=>x.id===id);return `<button class="badge" data-unselect="${id}" aria-label="取消关联${esc(t?.name||id)}">${esc(t?.name||id)} ×</button>`}).join('');$('relatedSelection').querySelectorAll('[data-unselect]').forEach(b=>b.onclick=()=>{chosen.delete(b.dataset.unselect);paint()});
 $('relatedCandidates').innerHTML=candidates.map(t=>{const occupied=groups.some(g=>g!==currentGroup&&g.includes(t.id));return `<label class="related-option"><input type="checkbox" value="${t.id}" ${chosen.has(t.id)?'checked':''} ${occupied?'disabled':''}><div><strong>${esc(t.name)}</strong><div>${esc(t.media)}${t.channel?' · '+esc(t.channel):''}</div><small>账号ID：${esc(t.accountId)}</small></div>${occupied?'<span class="quiet">已关联其他达人</span>':''}</label>`}).join('')||'<div class="empty">暂无匹配账号，请调整关键词或媒体。</div>';$('relatedCandidates').querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?chosen.add(i.value):chosen.delete(i.value);paint()})};
 $('relatedSearch').oninput=paint;$('relatedMedia').onchange=paint;$('cancelRelated').onclick=()=>$('modal').close();$('saveRelated').onclick=()=>{const groups=accountGroups(),old=groups.find(g=>g.includes(talent.id))||[],removed=old.filter(id=>id!==talent.id&&!chosen.has(id)),next=groups.filter(g=>!g.includes(talent.id));if(removed.length>1)next.push(removed);if(chosen.size)next.push([talent.id,...chosen]);try{localStorage.setItem('xmfx-talent-account-groups',JSON.stringify(next))}catch{toast('保存失败，请检查浏览器存储设置');return}$('modal').close();render();toast('关联账号已保存')};paint();
}

</script></body></html>
